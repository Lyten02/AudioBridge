[package]
name = "audiobridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "AudioBridge"
path = "src/main.rs"

[dependencies]
audiobridge-core = { path = "../core" }
anyhow = "1"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }

[target.'cfg(target_os = "linux")'.dependencies]
# winit loads libwayland/libX11/libxkbcommon and GL with dlopen: no build-time system libraries.
eframe = { version = "0.35", default-features = false, features = ["wayland", "x11"] }
# links libpipewire-0.3 (build: libpipewire-0.3-dev + libclang for bindgen)
pipewire = { version = "0.10", features = ["v0_3_49"] }
ksni = { version = "0.3", features = ["blocking"] }
# MPRIS (media keys); the same zbus as ksni
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Com_Urlmon",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
