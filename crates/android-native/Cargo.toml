[package]
name = "audiobridge-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "audiobridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
audiobridge-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Raw AAudio bindings (the same sys crate `ndk` 0.9 is built on). The safe `ndk::audio` wrapper gates
# usage/content-type/input-preset behind `api-level-28`, which would hard-link API 28 symbols and make the
# library fail to load on minSdk 26/27; those three setters are resolved with dlsym at runtime instead.
ndk-sys = { version = "0.6", features = ["audio"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = "0.4"
android_logger = "0.15"
# `log` feature: with no tracing subscriber installed, core's `tracing` events are forwarded to `log` → logcat.
tracing = { version = "0.1", features = ["log"] }
# iroh's DNS resolver reads the system DNS config through ndk-context; JNI init installs the app context.
ndk-context = "0.1"

[package.metadata.ndk]
# AAudio (libaaudio.so) exists from API 26; cargo-ndk would otherwise link against API 21 stubs.
platform = 26
targets = ["arm64-v8a"]
